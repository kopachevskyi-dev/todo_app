# Standalone configuration: never merge this file with compose.yaml.
name: todo-app-test
services:
  app:
    build: .
    ports:
      - "127.0.0.1:${TEST_APP_PORT:-3100}:3000"
    environment:
      DATABASE_URL: postgres://planner:test@db:5432/planner_test
      TZ: Europe/Warsaw
      BACKUPS_DIR: /tmp/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: test
      POSTGRES_DB: planner_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner_test"]
      interval: 2s
      timeout: 3s
      retries: 30
