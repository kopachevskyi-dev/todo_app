name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Resolve worktree image names
        run: docker compose build --print app verify > /tmp/todo-images.json
      - name: Build runtime and verification images
        uses: docker/bake-action@v7
        with:
          source: .
          files: /tmp/todo-images.json
          targets: |
            app
            verify
          load: true
          set: |
            app.cache-from=type=gha,scope=runtime
            app.cache-to=type=gha,scope=runtime,mode=max
            verify.cache-from=type=gha,scope=verify
            verify.cache-to=type=gha,scope=verify,mode=max
      - name: Verify in containers
        run: docker compose run --rm --no-deps verify
      - name: Clean up project resources
        if: always()
        run: docker compose down --volumes --remove-orphans
