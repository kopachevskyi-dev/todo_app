name: todo-app
services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://planner:planner@db:5432/planner
      TZ: ${TZ:-}
      BACKUPS_DIR: /data/backups
    volumes:
      - ${DATA_DIR:-~/Desktop/todo-app-data}/backups:/data/backups
      - /etc/localtime:/host-localtime:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner
    volumes:
      - ${DATA_DIR:-~/Desktop/todo-app-data}/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 2s
      timeout: 3s
      retries: 30
