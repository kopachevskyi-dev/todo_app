<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Backlog — quick capture</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Lexend',system-ui,sans-serif;background:#E6EADF;color:#1F2421}
a{color:inherit;text-decoration:none}
a:hover{color:#000}
button,input{font-family:inherit}
input::placeholder{color:#5B635E;opacity:1}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #2F6FDE;outline-offset:2px}
</style>
</helmet>
<div style="box-sizing:border-box;min-height:940px;padding:24px;background:#E6EADF">
<div style="box-sizing:border-box;display:flex;flex-wrap:wrap;min-height:892px;background:#FCFCFA;border-radius:22px;box-shadow:0 10px 40px rgba(40,50,40,.12);overflow:hidden">

<nav aria-label="Sections" style="flex:1 1 248px;box-sizing:border-box;padding:28px 16px;background:#F4F5F1;display:flex;flex-direction:column;gap:28px">
<div style="display:flex;flex-direction:column;gap:20px">
<div style="font-size:22px;font-weight:600;padding:0 12px">Tasks</div>
<label style="display:flex;align-items:center;gap:10px;height:44px;box-sizing:border-box;padding:0 12px;border-radius:12px;background:#fff;border:1px solid #E1E5DC;color:#5B635E">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
<input type="search" aria-label="Search" placeholder="Search" style="flex:1;min-width:0;border:0;background:transparent;font-size:15px;color:#1F2421">
</label>
</div>
<div style="display:flex;flex-direction:column;gap:4px">
<a href="Main.dc.html" aria-current="page" style="display:flex;align-items:center;gap:12px;height:44px;box-sizing:border-box;padding:0 12px;border-radius:12px;background:#E7EAE1;font-size:16px;font-weight:600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l8 4-8 4-8-4 8-4z"/><path d="M4 12l8 4 8-4M4 16l8 4 8-4"/></svg>
<span style="flex:1">Backlog</span><span style="font-size:13px;color:#5B635E">7</span></a>
<a href="Today.dc.html" style="display:flex;align-items:center;gap:12px;height:44px;box-sizing:border-box;padding:0 12px;border-radius:12px;font-size:16px;color:#3A423D">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
<span style="flex:1">Today</span><span style="font-size:13px;color:#5B635E">3</span></a>
<a href="History.dc.html" style="display:flex;align-items:center;gap:12px;height:44px;box-sizing:border-box;padding:0 12px;border-radius:12px;font-size:16px;color:#3A423D">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
<span style="flex:1">History</span></a>
</div>
<div style="display:flex;flex-direction:column;gap:4px">
<div style="padding:0 12px 6px;font-size:12px;font-weight:500;letter-spacing:.08em;color:#5B635E">LISTS</div>
<div style="display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;font-size:15px;color:#3A423D"><span style="width:12px;height:12px;border-radius:4px;background:#E3686A"></span>Personal</div>
<div style="display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;font-size:15px;color:#3A423D"><span style="width:12px;height:12px;border-radius:4px;background:#5FB4C6"></span>Work</div>
<div style="display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;font-size:15px;color:#3A423D"><span style="width:12px;height:12px;border-radius:4px;background:#F0C24B"></span>Home</div>
<div style="display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;font-size:15px;color:#5B635E"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New list</div>
</div>
<div style="flex:1"></div>
<div style="display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;font-size:15px;color:#3A423D">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</div>
</nav>

<main style="flex:999 1 520px;min-width:0;box-sizing:border-box;padding:36px 44px;display:flex;flex-direction:column;gap:28px">
<header style="display:flex;align-items:baseline;gap:16px;flex-wrap:wrap">
<h1 style="margin:0;font-size:40px;font-weight:600;letter-spacing:-.02em">Backlog</h1>
<span style="font-size:18px;font-weight:500;padding:4px 14px;border-radius:12px;background:#EEF0EA">7</span>
<p style="flex-basis:100%;margin:4px 0 0;font-size:15px;color:#5B635E">Everything you need to do someday. No date until you plan it.</p>
</header>
<div style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;gap:12px;min-height:60px;box-sizing:border-box;padding:0 8px 0 18px;border-radius:16px;background:#fff;border:2px solid #2F6FDE;box-shadow:0 6px 20px rgba(47,111,222,.12)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F6FDE" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
<input type="text" aria-label="New task" value="Renew driver's license" style="flex:1;min-width:0;height:52px;border:0;background:transparent;font-size:17px;color:#1F2421">
<a href="Plan.dc.html" style="display:flex;align-items:center;gap:10px;height:44px;box-sizing:border-box;padding:0 16px;border-radius:12px;background:#F4C94A;font-size:14px;font-weight:500">Add<span style="font-size:13px;padding:2px 8px;border-radius:6px;background:rgba(31,36,33,.1)">Enter</span></a>
</div>
<p style="margin:0 0 0 6px;font-size:13px;color:#5B635E">A title is enough. Add details, a list or a day later.</p>
</div>
<div style="display:flex;flex-direction:column">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<div style="display:flex;align-items:center;gap:14px;min-height:60px;box-sizing:border-box;padding:8px 16px;border-bottom:1px solid #EEF0EA">
<span aria-hidden="true" style="flex:none;width:22px;height:22px;box-sizing:border-box;border:1.5px solid #AEB5AB;border-radius:7px;background:#fff"></span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
<span style="font-size:16px">{{r.title}}</span>
<span style="display:flex;align-items:center;gap:8px;font-size:13px;color:#5B635E"><span style="width:10px;height:10px;border-radius:3px;background:{{r.color}}"></span>{{r.meta}}</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B635E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</div>
</sc-for>
</div>
</main>

<aside aria-label="Task details" style="flex:1 1 400px;max-width:440px;box-sizing:border-box;padding:28px;background:#F4F5F1;display:flex;align-items:center;justify-content:center">
<p style="margin:0;max-width:220px;text-align:center;font-size:15px;line-height:1.5;color:#5B635E">Select a task to add details</p>
</aside>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":940}}'>
class Component extends DCLogic {
renderVals() {
return {
rows: [
{ title: 'Draft the onboarding article', color: '#5FB4C6', meta: 'Work · 3 subtasks' },
{ title: 'Order a new laptop charger', color: '#F0C24B', meta: 'Home' },
{ title: 'Sort photos from the trip', color: '#E3686A', meta: 'Personal' },
{ title: 'Update my resume', color: '#5FB4C6', meta: 'Work' },
{ title: 'Book a dentist appointment', color: '#E3686A', meta: 'Personal' },
{ title: 'Think of a gift for Mom', color: '#E3686A', meta: 'Personal' },
{ title: 'Set up backups', color: '#F0C24B', meta: 'Home' }
]
};
}
}
</script>
</body>
</html>
