<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task — completed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Lexend',system-ui,sans-serif;background:#FCFCFA;color:#1F2421}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #2F6FDE;outline-offset:2px}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;background:#FCFCFA">

<div style="flex:none;display:flex;align-items:center;padding:8px 8px 0">
<a href="MobileHistory.dc.html" style="display:flex;align-items:center;gap:4px;height:44px;padding:0 12px 0 8px;border-radius:12px;font-size:15px;color:#3A423D"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>History</a>
</div>

<div style="flex:1;min-height:0;overflow-y:auto;box-sizing:border-box;padding:12px 16px 24px;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;flex-direction:column;gap:12px;align-items:flex-start">
<h1 style="margin:0;font-size:26px;font-weight:600;line-height:1.25;letter-spacing:-.01em">Renew driver's license</h1>
<span style="display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:10px;background:#1F2421;color:#fff;font-size:13px;font-weight:500"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Completed Nov 4, 2:20 PM</span>
</div>
<p style="margin:0;font-size:15px;line-height:1.55;color:#3A423D">My license expires in December. Book an appointment, get a medical certificate and a photo.</p>

<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:center;gap:12px;min-height:48px">
<span style="flex:0 0 64px;font-size:14px;color:#5B635E">List</span>
<button type="button" style="display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border:1px solid #E1E5DC;border-radius:12px;background:#fff;font-size:15px;color:#1F2421"><span style="width:12px;height:12px;border-radius:4px;background:#E3686A"></span>Personal</button>
</div>
<div style="display:flex;align-items:center;gap:12px;min-height:48px">
<span style="flex:0 0 64px;font-size:14px;color:#5B635E">Day</span>
<button type="button" style="display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border:1px solid #E1E5DC;border-radius:12px;background:#fff;font-size:15px;color:#1F2421">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Wed, Nov 4</button>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:2px">
<h2 style="margin:0 0 6px;font-size:17px;font-weight:600">Subtasks</h2>
<sc-for list="{{subtasks}}" as="s" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px;color:#5B635E"><span aria-hidden="true" style="width:20px;height:20px;border-radius:6px;background:#1F2421;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>{{s.title}}</div>
</sc-for>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<h2 style="margin:0 0 4px;font-size:17px;font-weight:600">Activity</h2>
<sc-for list="{{activity}}" as="a" hint-placeholder-count="4">
<div style="display:flex;align-items:center;gap:12px;font-size:13px;color:#5B635E"><span aria-hidden="true" style="flex:none;width:8px;height:8px;border-radius:50%;background:{{a.dot}}"></span>{{a.text}}</div>
</sc-for>
</div>
</div>

<div style="flex:none;display:flex;gap:12px;box-sizing:border-box;padding:12px 16px 20px;background:#FCFCFA;border-top:1px solid #E8EBE3">
<button type="button" aria-label="Delete task" style="flex:none;width:48px;height:48px;border:1px solid #E1E5DC;border-radius:12px;background:#fff;color:#1F2421;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg></button>
<button type="button" style="flex:1;height:48px;border:1px solid #AEB5AB;border-radius:12px;background:transparent;font-size:15px;font-weight:500;color:#1F2421">Move to backlog</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
subtasks: [
{ title: 'Medical certificate' },
{ title: 'Passport photo' },
{ title: 'Book an appointment' }
],
activity: [
{ text: 'Nov 2, 9:12 AM — added to backlog', dot: '#AEB5AB' },
{ text: 'Nov 3, 8:03 PM — description and subtasks added', dot: '#AEB5AB' },
{ text: 'Nov 3, 8:05 PM — planned for Nov 4', dot: '#AEB5AB' },
{ text: 'Nov 4, 2:20 PM — completed', dot: '#1F2421' }
]
};
}
}
</script>
</body>
</html>
