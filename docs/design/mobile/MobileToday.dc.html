<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today — day plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Lexend',system-ui,sans-serif;background:#FCFCFA;color:#1F2421}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #2F6FDE;outline-offset:2px}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;background:#FCFCFA">

<div style="flex:1;min-height:0;overflow-y:auto">
<header style="display:flex;flex-direction:column;gap:16px;padding:24px 16px 12px">
<div style="display:flex;flex-direction:column;gap:6px">
<h1 style="margin:0;font-size:32px;font-weight:600;letter-spacing:-.02em">Today</h1>
<p style="margin:0;font-size:14px;color:#5B635E">Wednesday, November 4</p>
</div>
<div style="display:flex;align-items:center;gap:14px">
<div style="flex:1;display:flex;flex-direction:column;gap:8px">
<span style="font-size:14px;color:#3A423D">2 of 5 done</span>
<div style="height:8px;border-radius:4px;background:#E7EAE1;overflow:hidden"><div style="width:40%;height:8px;border-radius:4px;background:#1F2421"></div></div>
</div>
<button type="button" style="flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border:1px solid #E1E5DC;border-radius:12px;background:#fff;font-size:14px;font-weight:500;color:#1F2421">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l8 4-8 4-8-4 8-4z"/><path d="M4 12l8 4 8-4M4 16l8 4 8-4"/></svg>From backlog</button>
</div>
</header>

<div style="display:flex;flex-direction:column">
<sc-for list="{{open}}" as="r" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:14px;min-height:64px;box-sizing:border-box;padding:8px 16px;border-bottom:1px solid #EEF0EA">
<span aria-hidden="true" style="flex:none;width:22px;height:22px;box-sizing:border-box;border:1.5px solid #AEB5AB;border-radius:7px;background:#fff"></span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
<span style="font-size:16px">{{r.title}}</span>
<span style="display:flex;align-items:center;gap:8px;font-size:13px;color:#5B635E"><span style="width:10px;height:10px;border-radius:3px;background:{{r.color}}"></span>{{r.meta}}</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B635E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</div>
</sc-for>
</div>

<div style="display:flex;flex-direction:column;padding:20px 0 96px">
<div style="padding:0 16px 8px;font-size:12px;font-weight:500;letter-spacing:.08em;color:#5B635E">DONE · 2</div>
<div style="display:flex;align-items:center;gap:14px;min-height:64px;box-sizing:border-box;padding:8px 16px;border-bottom:1px solid #EEF0EA">
<span aria-hidden="true" style="flex:none;width:22px;height:22px;border-radius:7px;background:#1F2421;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
<span style="font-size:16px;color:#5B635E">Reply to Marta about the contract</span>
<span style="display:flex;align-items:center;gap:8px;font-size:13px;color:#5B635E"><span style="width:10px;height:10px;border-radius:3px;background:#5FB4C6"></span>Work</span>
</span>
<span style="font-size:13px;color:#5B635E">10:05 AM</span>
</div>
<a href="MobileTask.dc.html" style="display:flex;align-items:center;gap:14px;min-height:64px;box-sizing:border-box;padding:8px 16px;border-bottom:1px solid #EEF0EA;background:#EEF0EA">
<span aria-hidden="true" style="flex:none;width:22px;height:22px;border-radius:7px;background:#1F2421;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
<span style="font-size:16px;color:#5B635E">Renew driver's license</span>
<span style="display:flex;align-items:center;gap:8px;font-size:13px;color:#5B635E"><span style="width:10px;height:10px;border-radius:3px;background:#E3686A"></span>Personal · from backlog, 2 days</span>
</span>
<span style="font-size:13px;color:#5B635E">2:20 PM</span>
</a>
</div>
</div>

<nav aria-label="Sections" style="flex:none;height:68px;box-sizing:border-box;display:flex;background:#FCFCFA;border-top:1px solid #E8EBE3">
<a href="MobileCapture.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:#3A423D">
<span style="width:56px;height:30px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l8 4-8 4-8-4 8-4z"/><path d="M4 12l8 4 8-4M4 16l8 4 8-4"/></svg></span>Backlog</a>
<a href="MobileToday.dc.html" aria-current="page" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600">
<span style="width:56px;height:30px;border-radius:15px;background:#E7EAE1;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span>Today</a>
<a href="MobileHistory.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:#3A423D">
<span style="width:56px;height:30px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></span>History</a>
</nav>

<button type="button" aria-label="Add task to today" style="position:absolute;right:16px;bottom:84px;width:56px;height:56px;border:0;border-radius:18px;background:#F4C94A;color:#1F2421;box-shadow:0 8px 24px rgba(31,36,33,.2);display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
open: [
{ title: 'Write the landing page outline', color: '#5FB4C6', meta: 'Work' },
{ title: 'Buy a water filter', color: '#F0C24B', meta: 'Home' },
{ title: 'Run 5 km', color: '#E3686A', meta: 'Personal' }
]
};
}
}
</script>
</body>
</html>
