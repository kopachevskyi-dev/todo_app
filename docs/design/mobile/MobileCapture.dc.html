<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Backlog — capture sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Lexend',system-ui,sans-serif;background:#FCFCFA;color:#1F2421}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit}
input::placeholder{color:#5B635E;opacity:1}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #2F6FDE;outline-offset:2px}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;background:#FCFCFA">

<div style="flex:1;min-height:0;overflow-y:auto">
<header style="display:flex;flex-direction:column;gap:6px;padding:24px 16px 12px">
<div style="display:flex;align-items:center;gap:12px">
<h1 style="margin:0;font-size:32px;font-weight:600;letter-spacing:-.02em">Backlog</h1>
<span style="font-size:16px;font-weight:500;padding:3px 12px;border-radius:11px;background:#EEF0EA">7</span>
</div>
<p style="margin:0;font-size:14px;color:#5B635E">Everything you need to do someday.</p>
</header>
<div style="display:flex;flex-direction:column;padding:0 0 16px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<div style="display:flex;align-items:center;gap:14px;min-height:64px;box-sizing:border-box;padding:8px 16px;border-bottom:1px solid #EEF0EA">
<span aria-hidden="true" style="flex:none;width:22px;height:22px;box-sizing:border-box;border:1.5px solid #AEB5AB;border-radius:7px;background:#fff"></span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
<span style="font-size:16px">{{r.title}}</span>
<span style="display:flex;align-items:center;gap:8px;font-size:13px;color:#5B635E"><span style="width:10px;height:10px;border-radius:3px;background:{{r.color}}"></span>{{r.meta}}</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B635E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</div>
</sc-for>
</div>
</div>

<nav aria-label="Sections" style="flex:none;height:68px;box-sizing:border-box;display:flex;background:#FCFCFA;border-top:1px solid #E8EBE3">
<a href="MobileCapture.dc.html" aria-current="page" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600">
<span style="width:56px;height:30px;border-radius:15px;background:#E7EAE1;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l8 4-8 4-8-4 8-4z"/><path d="M4 12l8 4 8-4M4 16l8 4 8-4"/></svg></span>Backlog</a>
<a href="MobileToday.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:#3A423D">
<span style="width:56px;height:30px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span>Today</a>
<a href="MobileHistory.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:#3A423D">
<span style="width:56px;height:30px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></span>History</a>
</nav>

<button type="button" aria-label="Add task" style="position:absolute;right:16px;bottom:84px;width:56px;height:56px;border:0;border-radius:18px;background:#F4C94A;color:#1F2421;box-shadow:0 8px 24px rgba(31,36,33,.2);display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

<div style="position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(31,36,33,.38)"></div>

<div role="dialog" aria-label="New task" style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:10px 16px 28px;border-radius:24px 24px 0 0;background:#FCFCFA;box-shadow:0 -10px 40px rgba(31,36,33,.18);display:flex;flex-direction:column;gap:16px">
<div style="align-self:center;width:40px;height:4px;border-radius:2px;background:#D5DAD0"></div>
<span style="font-size:14px;font-weight:500;color:#5B635E">New task</span>
<div style="display:flex;align-items:center;gap:12px;min-height:56px;box-sizing:border-box;padding:0 16px;border-radius:16px;background:#fff;border:2px solid #2F6FDE;box-shadow:0 6px 20px rgba(47,111,222,.12)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F6FDE" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
<input type="text" aria-label="Task title" value="Renew driver's license" style="flex:1;min-width:0;height:52px;border:0;background:transparent;font-size:17px;color:#1F2421">
</div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
<p style="margin:0;font-size:13px;line-height:1.4;color:#5B635E">A title is enough. Add details later.</p>
<a href="MobilePlan.dc.html" style="flex:none;display:flex;align-items:center;justify-content:center;height:48px;padding:0 28px;border-radius:12px;background:#F4C94A;font-size:15px;font-weight:500">Add</a>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
rows: [
{ title: 'Draft the onboarding article', color: '#5FB4C6', meta: 'Work · 3 subtasks' },
{ title: 'Order a new laptop charger', color: '#F0C24B', meta: 'Home' },
{ title: 'Sort photos from the trip', color: '#E3686A', meta: 'Personal' },
{ title: 'Update my resume', color: '#5FB4C6', meta: 'Work' },
{ title: 'Book a dentist appointment', color: '#E3686A', meta: 'Personal' },
{ title: 'Think of a gift for Mom', color: '#E3686A', meta: 'Personal' },
{ title: 'Set up backups', color: '#F0C24B', meta: 'Home' }
]
};
}
}
</script>
</body>
</html>
